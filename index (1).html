<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matmata Moto Store — Gestion</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mu:#6b7385;--pr:#d9480f;--bd:#e2e5ea;--ok:#2b8a3e;--ko:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8eaee;--mu:#98a0b0;--bd:#2c323d;--pr:#ff8a4c}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:215px;background:var(--card);border-right:1px solid var(--bd);padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{font-size:16px;margin:4px 8px 12px;color:var(--pr)}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--tx);text-decoration:none;margin-bottom:2px}
nav a.on,nav a:hover{background:var(--pr);color:#fff}
main{flex:1;padding:18px;min-width:0}
h2{margin:0 0 14px}h3{margin:18px 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.k small{color:var(--mu)}.k b{display:block;font-size:22px;margin-top:4px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{color:var(--ko)}button.s{padding:4px 8px;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar input[type=search],.bar input.w{flex:1;min-width:150px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}.tag.r{background:#ffe3e3;color:var(--ko)}.tag.v{background:#d3f9d8;color:var(--ok)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:18px;width:min(520px,94vw)}
dialog::backdrop{background:#0008}dialog label{display:block;margin:8px 0 3px;color:var(--mu);font-size:12px}dialog input,dialog select{width:100%}
.hit{border:1px solid var(--bd);border-radius:8px;max-height:220px;overflow:auto}.hit div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--bd)}.hit div:hover{background:var(--bd)}
.best{background:#d3f9d8;color:#1b5e20}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;color:#000;background:#fff;padding:10px}#pr table{font-size:12px}#pr th,#pr td{border:1px solid #999}}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}nav h1{width:100%}nav a{padding:6px 9px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<nav id="nav"></nav>
<main id="m"></main>
<dialog id="dlg"></dialog>
<div id="pr"></div>
<script>
const $=s=>document.querySelector(s),f=(n,d=2)=>(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
now=()=>today()+'T'+new Date().toTimeString().slice(0,5);
const CUR=()=>(S&&S.settings&&S.settings.cur)||'DT',APP=()=>(S&&S.settings&&S.settings.name)||'Ma boutique';
let S,cart=[],pg={},KEY='matmata_v5';
const PAGES=[['dash','📊 Tableau de bord'],['prod','📦 Produits'],['vente','🛒 Ventes'],['rap','📈 Rapports'],['alert','⚠️ Alertes'],['cmd','🚚 Commandes'],['cmp','⚖️ Comparaison prix'],['four','🏭 Fournisseurs'],['cli','👤 Clients'],['set','⚙️ Paramètres'],['data','💾 Données']];
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const P=c=>S.products.find(p=>p.code===c);
const val=p=>p.stock*(p.last||p.buy);
const isAl=p=>p.stock<=p.thr;
const mv=(code,type,qty,note)=>S.mvts.push({d:now(),code,type,qty,note:note||''});

function norm(){S.settings=Object.assign({name:'Ma boutique',icon:'🏪',cur:'DT'},S.settings||{});S.categories=S.categories||[];['products','sales','suppliers','clients','orders','mvts','prices'].forEach(k=>S[k]=S[k]||[])}
function buildNav(){document.title=APP()+' — Gestion';
 $('#nav').innerHTML=`<h1>${esc(S.settings.icon)} ${esc(APP())}</h1><div style="margin:-8px 8px 10px;font-size:11px;color:var(--mu)">version 6 · 11/10/2026</div>`+PAGES.map(([k,t])=>`<a href="#${k}" data-k="${k}">${t}</a>`).join('')}
async function init(){
 const raw=localStorage.getItem(KEY);
 if(raw)S=JSON.parse(raw);
 else{
  const j=await (await fetch('data.json')).json();
  S={products:j.products.map(a=>({code:a[0],name:a[1],cat:a[2],buy:a[3],sell:a[4],stock:a[5],thr:a[6],sup:a[7],last:a[8]})),
   sales:j.sales.map(a=>({id:a[0],d:a[1],code:a[2],name:a[3],price:a[4],qty:a[5],total:a[6],profit:a[7],client:a[8]})),
   suppliers:j.suppliers.map(a=>({name:a[0],tel:a[1]})),clients:j.clients.map(a=>({name:a[0],tel:a[1]})),orders:[],mvts:[],prices:[],categories:[],
   settings:{name:j.appName||'Ma boutique',icon:j.appIcon||'🏪',cur:j.currency||'DT'}};
  S.products.forEach(p=>{if(p.sup)S.prices.push({code:p.code,sup:p.sup,price:p.last||p.buy,d:'import'})});
  save();
 }
 norm();buildNav();
 addEventListener('hashchange',route);route();
}
function route(){
 const k=(location.hash||'#dash').slice(1);
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
 const fn=R[k]||R.dash;$('#m').innerHTML=fn();if(A[k])A[k]();
}
const go=()=>route();
function modal(html){$('#dlg').innerHTML=html;$('#dlg').showModal()}
const closeM=()=>$('#dlg').close();
const rows=(a,fn)=>a.map(fn).join('');
const opt=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');

/* ---------- calculs ---------- */
function stats(a,b){ // sales between dates (YYYY-MM-DD inclusive)
 const L=S.sales.filter(s=>(!a||s.d.slice(0,10)>=a)&&(!b||s.d.slice(0,10)<=b));
 return{ca:L.reduce((x,s)=>x+s.total,0),pf:L.reduce((x,s)=>x+s.profit,0),n:new Set(L.map(s=>s.id)).size,L};
}

const R={},A={};
/* ---------- Tableau de bord ---------- */
R.dash=()=>{
 const t=stats(today(),today()),all=stats(),al=S.products.filter(isAl).length,m={};
 S.sales.forEach(s=>{const o=m[s.code]||(m[s.code]={code:s.code,name:s.name,q:0,ca:0,pf:0});o.q+=s.qty;o.ca+=s.total;o.pf+=s.profit});
 const top=Object.values(m).sort((a,b)=>b.q-a.q).slice(0,10);
 return`<h2>Tableau de bord</h2><div class="g">
 <div class="k"><small>Valeur totale du stock</small><b>${f(S.products.reduce((x,p)=>x+val(p),0))} ${CUR()}</b></div>
 <div class="k"><small>Chiffre d'affaires total</small><b>${f(all.ca)} ${CUR()}</b></div>
 <div class="k"><small>Ventes du jour</small><b>${f(t.ca)} ${CUR()}</b></div>
 <div class="k"><small>Profit du jour</small><b>${f(t.pf)} ${CUR()}</b></div>
 <div class="k"><small>Articles en alerte</small><b><a href="#alert" style="color:var(--ko)">${al}</a></b></div></div>
 <div class="c"><h3 style="margin-top:0">🏆 10 meilleurs produits (par quantité vendue)</h3><div class="tw"><table><tr><th>#</th><th>Code</th><th>Désignation</th><th class="n">Qté vendue</th><th class="n">CA (${CUR()})</th><th class="n">Profit (${CUR()})</th></tr>
 ${rows(top,(x,i)=>`<tr><td>${i+1}</td><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td class="n">${f(x.q,0)}</td><td class="n">${f(x.ca)}</td><td class="n">${f(x.pf)}</td></tr>`)}</table></div></div>`;
};

/* ---------- Produits ---------- */
const FIELDS={code:'Code article',name:'Désignation',sell:'Prix de vente',buy:"Prix d'achat",stock:'Quantité'};
function matchP(p,fld,q){q=q.trim().toLowerCase();if(!q)return true;return String(p[fld]).toLowerCase().includes(q.replace(',','.'))}
R.prod=()=>{pg.prod=pg.prod||{fld:'name',q:'',n:50};return`<h2>Gestion des produits</h2><div class="bar">
 <select id="pf">${Object.entries(FIELDS).map(([k,v])=>`<option value="${k}" ${pg.prod.fld===k?'selected':''}>${v}</option>`).join('')}</select>
 <input type="search" id="pq" placeholder="Rechercher…" value="${esc(pg.prod.q)}"><button class="p" onclick="formP()">+ Ajouter un produit</button><button class="p" onclick="formA()">📥 Nouvel arrivage</button><button onclick="formC()">🏷 Gérer les catégories</button></div>
 <div class="bar"><button onclick="exportX()">⬇ Télécharger la liste (Excel)</button><a href="produits-initiaux.xlsx" download="produits-initiaux.xlsx" style="text-decoration:none"><button type="button">📄 Télécharger la liste d'origine (Excel)</button></a><button class="p" onclick="pickX('add')">📋 Remplir le tableau (Excel)</button><button class="d" onclick="delAll()">🗑 Supprimer tous les produits</button>
 <input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden onchange="importX(this)"></div><div class="c tw" id="pt"></div>`};
A.prod=()=>{const g=pg.prod;
 $('#pf').onchange=e=>{g.fld=e.target.value;g.n=50;tp()};$('#pq').oninput=e=>{g.q=e.target.value;g.n=50;tp()};tp()};
function tp(){const g=pg.prod,L=S.products.filter(p=>matchP(p,g.fld,g.q));
 if(!S.products.length){$('#pt').innerHTML='<p style="padding:10px"><b>Le tableau des produits est vide.</b><br>Ajoutez vos produits un par un (« + Ajouter un produit »), ou importez une liste Excel avec « 📋 Remplir le tableau (Excel) ». Pour obtenir un modèle de fichier, cliquez sur « ⬇ Télécharger la liste (Excel) ».</p>';return}
 $('#pt').innerHTML=`<small>${L.length} produit(s)</small><table><tr><th>Code</th><th>Désignation</th><th>Catégorie</th><th class="n">P. achat</th><th class="n">P. vente</th><th class="n">Qté</th><th>Seuil</th><th></th></tr>
 ${rows(L.slice(0,g.n),p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td><select class="s" onchange="setCat('${esc(p.code)}',this.value)" style="max-width:150px"><option value="">—</option>${opt(cats(p.cat),p.cat)}<option value="__new__">➕ Nouvelle…</option></select></td><td class="n">${f(p.buy,3)}</td><td class="n">${f(p.sell,3)}</td>
 <td class="n"><span class="tag ${isAl(p)?'r':'v'}">${p.stock}</span></td><td>${p.thr}</td>
 <td><button class="s" onclick="formP('${esc(p.code)}')">Modifier</button> <button class="s" onclick="formA('${esc(p.code)}')">Arrivage</button> <button class="s" onclick="hist('${esc(p.code)}')">Historique</button> <button class="s d" onclick="delP('${esc(p.code)}')">Suppr.</button></td></tr>`)}</table>
 ${L.length>g.n?`<p><button onclick="pg.prod.n+=100;tp()">Afficher plus (${L.length-g.n})</button></p>`:''}`}
const cats=(extra)=>[...new Set([...S.categories,...S.products.map(p=>String(p.cat||'').trim()),extra&&String(extra).trim()].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
function setCat(code,v){if(v==='__new__'){v=(prompt('Nom de la nouvelle catégorie :')||'').trim();if(!v){tp();return}if(!S.categories.includes(v)&&!cats().includes(v))S.categories.push(v)}
 const p=P(code);if(p){p.cat=v;save()}tp()}
function formC(){const L=cats(),cnt=c=>S.products.filter(p=>p.cat===c).length;
 modal(`<h3 style="margin-top:0">🏷 Catégories</h3><div class="bar"><input class="w" id="cn" placeholder="Nouvelle catégorie…"><button class="p" onclick="addCat()">+ Ajouter</button></div>
 <div class="tw" style="max-height:50vh;overflow:auto"><table><tr><th>Catégorie</th><th class="n">Produits</th><th></th></tr>${rows(L,c=>`<tr><td>${esc(c)}</td><td class="n">${cnt(c)}</td><td><button class="s" onclick="renCat(this.dataset.c)" data-c="${esc(c)}">Renommer</button> <button class="s d" onclick="delCat(this.dataset.c)" data-c="${esc(c)}">Supprimer</button></td></tr>`)||'<tr><td colspan=3>Aucune catégorie</td></tr>'}</table></div>
 <p><small style="color:var(--mu)">Renommer une catégorie la change pour tous ses produits. Saisir le nom d'une catégorie existante les fusionne.</small></p><p><button onclick="closeM();go()">Fermer</button></p>`)}
function addCat(){const v=$('#cn').value.trim();if(!v)return;if(!cats().some(c=>c.toLowerCase()===v.toLowerCase()))S.categories.push(v);save();formC()}
function renCat(c){const n=(prompt('Nouveau nom pour « '+c+' » :',c)||'').trim();if(!n||n===c)return;
 S.products.forEach(p=>{if(p.cat===c)p.cat=n});S.categories=S.categories.filter(x=>x!==c);if(!S.categories.includes(n))S.categories.push(n);save();formC()}
function delCat(c){const n=S.products.filter(p=>p.cat===c).length;if(!confirm(n?`Supprimer la catégorie « ${c} » ? Ses ${n} produit(s) n'auront plus de catégorie.`:`Supprimer la catégorie « ${c} » ?`))return;
 S.products.forEach(p=>{if(p.cat===c)p.cat=''});S.categories=S.categories.filter(x=>x!==c);save();formC()}
function formP(code){const p=code?P(code):{code:'',name:'',cat:'',buy:'',sell:'',stock:0,thr:1,sup:''};
 modal(`<h3 style="margin-top:0">${code?'Modifier':'Nouveau'} produit</h3>
 <label>Code article</label><input id="f1" value="${esc(p.code)}" ${code?'readonly':''}><label>Désignation</label><input id="f2" value="${esc(p.name)}">
 <label>Catégorie</label><select id="f3" onchange="$('#f3n').style.display=this.value==='__new__'?'block':'none'"><option value="">—</option>${opt(cats(p.cat),p.cat)}<option value="__new__">➕ Nouvelle catégorie…</option></select><input id="f3n" placeholder="Nom de la nouvelle catégorie" style="display:none;margin-top:6px"><label>Prix d'achat (${CUR()})</label><input id="f4" type="number" step="0.001" value="${p.buy}">
 <label>Prix de vente (${CUR()})</label><input id="f5" type="number" step="0.001" value="${p.sell}"><label>Quantité en stock</label><input id="f6" type="number" value="${p.stock}">
 <label>Seuil d'alerte</label><input id="f7" type="number" value="${p.thr}"><label>Fournisseur</label><select id="f8"><option value="">—</option>${opt(S.suppliers.map(s=>s.name),p.sup)}</select>
 <p><button class="p" onclick="saveP('${esc(code||'')}')">Enregistrer</button> <button onclick="closeM()">Annuler</button></p>`)}
function saveP(old){const v=i=>$('#f'+i).value.trim(),code=v(1);
 if(!code||!v(2))return alert('Code et désignation obligatoires');
 if(!old&&P(code))return alert('Ce code existe déjà');
 const cat=$('#f3').value==='__new__'?$('#f3n').value.trim():v(3);
 if($('#f3').value==='__new__'&&!cat)return alert('Saisissez le nom de la nouvelle catégorie');
 const d={name:v(2),cat,buy:+v(4)||0,sell:+v(5)||0,stock:+v(6)||0,thr:+v(7)||0,sup:v(8)};
 if(old){const p=P(old);if(d.stock!==p.stock)mv(old,'Ajustement',d.stock-p.stock,'Modification manuelle');Object.assign(p,d)}
 else{S.products.push({code,last:null,...d});mv(code,'Création',d.stock,'Stock initial')}
 if(d.sup&&d.buy)setPrice(code,d.sup,d.buy);save();closeM();go()}
function delP(c){if(confirm('Supprimer le produit '+c+' ?')){S.products=S.products.filter(p=>p.code!==c);S.prices=S.prices.filter(x=>x.code!==c);save();tp()}}
function hist(c){const p=P(c),L=[...S.sales.filter(s=>s.code===c).map(s=>({d:s.d,type:'Vente',qty:-s.qty,note:s.id+' — '+s.client})),...S.mvts.filter(m=>m.code===c)].sort((a,b)=>b.d.localeCompare(a.d));
 modal(`<h3 style="margin-top:0">Historique — ${esc(p.name)}</h3><div class="tw" style="max-height:60vh;overflow:auto"><table><tr><th>Date</th><th>Mouvement</th><th class="n">Qté</th><th>Détail</th></tr>
 ${rows(L,m=>`<tr><td>${m.d.replace('T',' ')}</td><td>${m.type}</td><td class="n">${m.qty>0?'+':''}${m.qty}</td><td>${esc(m.note)}</td></tr>`)||'<tr><td colspan=4>Aucun mouvement</td></tr>'}</table></div><p><button onclick="closeM()">Fermer</button></p>`)}
function setPrice(code,sup,price){const x=S.prices.find(y=>y.code===code&&y.sup===sup);if(x){x.price=price;x.d=today()}else S.prices.push({code,sup,price,d:today()})}

/* ---------- Excel : export / import ---------- */
const nk=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function needX(){if(typeof XLSX==='undefined'){alert('Bibliothèque Excel non chargée (connexion internet requise).');return true}}
function exportX(){if(needX())return;
 const d=S.products.map(p=>({'Code article':p.code,'Désignation':p.name,'Catégorie':p.cat,"Prix d'achat":p.buy,'Prix de vente':p.sell,'Quantité':p.stock,"Seuil d'alerte":p.thr,'Fournisseur':p.sup,"Dernier prix d'achat":p.last||''}));
 const ws=XLSX.utils.json_to_sheet(d,{header:['Code article','Désignation','Catégorie',"Prix d'achat",'Prix de vente','Quantité',"Seuil d'alerte",'Fournisseur',"Dernier prix d'achat"]}),wb=XLSX.utils.book_new();ws['!cols']=[{wch:16},{wch:40},{wch:18},{wch:12},{wch:12},{wch:10},{wch:12},{wch:22}];
 XLSX.utils.book_append_sheet(wb,ws,'Produits');XLSX.writeFile(wb,'produits-'+today()+'.xlsx')}
function delAll(){const n=S.products.length;
 if(!n)return alert('Le tableau des produits est déjà vide.');
 if(!confirm(`Supprimer les ${n} produits (avec leurs prix fournisseurs et mouvements) ?\n\nUne sauvegarde JSON va être téléchargée automatiquement avant la suppression.\nLes ventes déjà enregistrées sont conservées.`))return;
 if(!confirm('Dernière confirmation : vider complètement le tableau des produits ?'))return;
 try{exportJ()}catch(e){}
 S.products=[];S.prices=[];S.mvts=[];save();alert('Tous les produits ont été supprimés. Utilisez « Remplir le tableau (Excel) » pour importer la nouvelle liste.');go()}
let xMode='add';
function pickX(m){xMode=m;const i=$('#xf');i.value='';i.click()}
const XA={code:['code','sku','reference','ref'],name:['designation','libelle','nomproduit','nomarticle','nom','article'],cat:['categorie','category','famille'],
 last:['dernierprix'],buy:['prixdachat','prixachat'],sell:['prixdevente','prixvente','vente','prix'],
 stock:['stockactuel','quantite','qtestock','stock','qte','qty'],thr:['seuil']};
const XEX={stock:['initial','vendue','vendu','achetee','alerte'],buy:['dernier'],sell:['achat'],cat:[],name:[],code:[],last:[],thr:[]};
function mapCols(keys){const map={},used=new Set();
 for(const f of ['code','name','cat','last','buy','sell','stock','thr']){
  outer:for(const a of XA[f])for(const k of keys){const n=nk(k);if(used.has(k)||!n.startsWith(a)||XEX[f].some(x=>n.includes(x)))continue;map[f]=k;used.add(k);break outer}}
 const sk=keys.find(k=>!used.has(k)&&nk(k).includes('fournisseur'));if(sk)map.sup=sk;return map}
function importX(inp){const file=inp.files[0];if(!file||needX())return;const r=new FileReader();
 r.onload=()=>{try{
  const wb=XLSX.read(r.result,{type:'array'});let rows=[];
  for(const sn of wb.SheetNames){const t=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''});if(t.length&&Object.keys(t[0]).some(k=>nk(k).startsWith('code')||nk(k).startsWith('sku'))&&Object.keys(t[0]).some(k=>nk(k).startsWith('designation')||nk(k).startsWith('libelle'))){rows=t;break}}
  if(!rows.length)rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!rows.length)return alert('Fichier vide');
  const map=mapCols(Object.keys(rows[0]));
  if(!map.stock&&!confirm('Aucune colonne de quantité (« Stock Actuel » ou « Quantité ») trouvée : les quantités seront mises à 0. Continuer ?'))return;
  if(!map.code||!map.name)return alert('Colonnes introuvables : le fichier doit contenir au moins « Code article » et « Désignation ».');
  const num=v=>{const x=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(x)?0:x},seen=new Set(),L=[];let dup=0;
  rows.forEach(o=>{const code=String(o[map.code]).trim(),name=String(o[map.name]).trim();if(!code||!name)return;let c2=code;if(seen.has(c2)){dup++;let n=2;while(seen.has(code+'-'+n))n++;c2=code+'-'+n}seen.add(c2);
   const lp=map.last?num(o[map.last]):0;L.push({code:c2,name,cat:map.cat?String(o[map.cat]).trim():'',buy:num(o[map.buy]),sell:num(o[map.sell]),stock:num(o[map.stock]),thr:1,sup:map.sup?String(o[map.sup]).trim():'',last:lp>0?lp:null})});
  if(!L.length)return alert('Aucun produit valide trouvé');
  const addPrices=p=>{if(p.sup&&p.buy)setPrice(p.code,p.sup,p.buy)};
  if(xMode==='replace'){
   if(!confirm(`Remplacer les ${S.products.length} produits existants par les ${L.length} produits du fichier ?\n(Les ventes sont conservées.) Pensez à exporter une sauvegarde avant.`))return;
   S.products=L;S.prices=[];L.forEach(addPrices);S.mvts.push({d:now(),code:'—',type:'Remplacement liste',qty:L.length,note:file.name});
   save();alert(`Liste remplacée : ${L.length} produits.\nQuantité totale en stock : ${f(L.reduce((a,p)=>a+p.stock,0),0)}\nValeur du stock : ${f(L.reduce((a,p)=>a+val(p),0))} ${CUR()}${dup?`\n${dup} code(s) en double renommé(s) avec un suffixe (-2, -3…).`:''}`);
  }else{
   const before=S.products.length;let add=0,skip=0;L.forEach(p=>{if(P(p.code)){skip++;return}S.products.push(p);addPrices(p);mv(p.code,'Import liste',p.stock,file.name);add++});
   save();alert(`${add} produit(s) ajouté(s).\nTotal : ${S.products.length} produits · quantité en stock ${f(S.products.reduce((a,p)=>a+p.stock,0),0)} · valeur du stock ${f(S.products.reduce((a,p)=>a+val(p),0))} ${CUR()}${before?'\n(Le tableau n\'était pas vide : les codes déjà présents ont été conservés tels quels. Pour repartir de zéro, supprimez d\'abord tous les produits.)':''}\n${skip?`\n${skip} déjà existant(s) (ignoré(s)).`:''}${dup?`\n${dup} code(s) en double renommé(s) avec un suffixe.`:''}`);
  }
  go()}catch(e){alert('Lecture du fichier impossible : '+e.message)}};
 r.readAsArrayBuffer(file)}

 h.style.display='block';h.innerHTML=S.products.filter(p=>p.code.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)).slice(0,12).map(p=>`<div onclick="aPick('${esc(p.code)}')">${esc(p.code)} — ${esc(p.name)}</div>`).join('')}

 const nums=S.sales.map(s=>+String(s.id).replace(/\D/g,'')).filter(Boolean),id='VTE-'+(Math.max(0,...nums)+1),cl=$('#scl').value,d=now();

function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=(APP().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sauvegarde')+'-'+today()+'.json';a.click()}
function importJ(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.products||!j.sales)throw 0;S=j;norm();save();buildNav();alert('Sauvegarde importée');go()}catch{alert('Fichier invalide')}};r.readAsText(file)}
function resetAll(){if(confirm('Effacer TOUTES les données (produits, ventes, clients, fournisseurs…) et repartir d\'une application vide ? Pensez à exporter une sauvegarde avant.')){localStorage.removeItem(KEY);location.reload()}}
init();
</script>
